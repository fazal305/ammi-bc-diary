name: Bug report
description: Something in the diary does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add three members
        2. Open the draw screen and press the draw button
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 140 on a Samsung A15
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please do not paste real members' names or phone numbers. Made-up examples are fine.
